[package]
name = "spelaiondb-plugin-flightsql"
description = "Arrow Flight SQL for SpelaionDB: one driver for every engine that speaks it, served as a plugin"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/spelaion-dev/spelaiondb-plugin-flightsql"
publish = false

[lib]
name = "spelaion_driver_flightsql"

[[bin]]
name = "spelaiondb-plugin-flightsql"
path = "src/bin/spelaiondb-plugin-flightsql.rs"

# The contract and the plugin's side of the protocol come from SpelaionDB's repository, by tag
# (ADR-042): they are one workspace there, so one tag pins them together. Moving the tag is how
# this plugin follows a protocol change.
[dependencies]
spelaion-driver-api = { git = "https://github.com/spelaion-dev/spelaiondb", tag = "plugin-sdk-v0.2.0" }
spelaion-plugin-sdk = { git = "https://github.com/spelaion-dev/spelaiondb", tag = "plugin-sdk-v0.2.0" }
# The same Arrow as SpelaionDB's: batches cross the two unchanged, and Flight SQL's results are
# Arrow already. The Flight client is Arrow's own, of the same release.
arrow = { version = "60", default-features = false, features = ["ipc", "prettyprint"] }
arrow-flight = { version = "60", default-features = false, features = ["flight-sql", "tls-ring"] }
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
# ring instead of aws-lc-rs: the latter needs CMake and NASM on Windows.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-ring"] }

[dev-dependencies]
# The conformance set every plugin runs against its own program (tests/conformance.rs).
spelaion-plugin-host = { git = "https://github.com/spelaion-dev/spelaiondb", tag = "plugin-sdk-v0.2.0" }

[lints.rust]
unsafe_code = "forbid"

# What ships is this program: small and without the debugger's tables.
[profile.release]
strip = "symbols"
